
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Conceptual</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
        }

        header {
            background: #142d49;
            color: white;
            padding: 25px;
        }

        h1 {
            margin: 0;
            font-size: 25px;
        }

        .contenedor {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }

        img {
            width: 100%;
            height: auto;
        }

        .boton {
            display: inline-block;
            margin: 15px 5px;
            padding: 12px 20px;
            background: #142d49;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .boton:hover {
            background: #2563a6;
        }
    </style>
</head>

<body>

    <header>
        <h1>ANÁLISIS Y VERIFICACIÓN DE PROGRAMAS</h1>
        <p>Mapa conceptual interactivo de consulta</p>
    </header>

    <main class="contenedor">

        <h2>Mapa conceptual</h2>

        <img
            src="resultado/mapa_conceptual.svg"
            alt="Mapa conceptual de análisis y verificación de programas"
        >

        <a class="boton"
           href="resultado/mapa_conceptual.png"
           download>
           Descargar PNG
        </a>

        <a class="boton"
           href="resultado/mapa_conceptual.svg"
           download>
           Descargar SVG
        </a>

    </main>

</body>
</html>
